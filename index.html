<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Match Card</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0b0e14; color: #fff; }
    .card { text-align: center; padding: 24px; background: #1a1f2c; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); max-width: 80%; }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #00ff85; border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    p { margin: 0; font-size: 14px; color: #a0aec0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p id="msg">กำลังเปิดหน้าต่างส่งต่อการ์ด...</p>
  </div>

  <script>
    // 🟢 ใส่ LIFF ID ของคุณตรงนี้
    const LIFF_ID = "2009210214-G4R7lVn9"; 

    async function initShare() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const flexRaw = urlParams.get('flex');

        if (!flexRaw) {
          document.getElementById("msg").innerText = "ไม่พบข้อมูลการ์ด";
          setTimeout(() => liff.closeWindow(), 2000);
          return;
        }

        const flexObj = JSON.parse(decodeURIComponent(flexRaw));

        if (liff.isApiAvailable('shareTargetPicker')) {
          await liff.shareTargetPicker([
            {
              type: "flex",
              altText: "แชร์ผลบอลสด พรีเมียร์ลีก",
              contents: flexObj
            }
          ]);
          liff.closeWindow();
        } else {
          alert("อุปกรณ์ของคุณไม่รองรับการแชร์การ์ด");
          liff.closeWindow();
        }
      } catch (err) {
        console.error(err);
        document.getElementById("msg").innerText = "เกิดข้อผิดพลาดในการแชร์";
        setTimeout(() => liff.closeWindow(), 2500);
      }
    }
    initShare();
  </script>
</body>
</html>
