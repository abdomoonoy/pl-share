<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Match Card</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0b0e14; color: #fff; }
    .card { text-align: center; padding: 24px; background: #1a1f2c; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); max-width: 85%; }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #00ff85; border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    p { margin: 0; font-size: 14px; color: #a0aec0; word-break: break-word; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="loader"></div>
    <p id="msg">กำลังเปิดหน้าต่างส่งต่อการ์ด...</p>
  </div>

  <script>
    const LIFF_ID = "2011335665-i2smhkIR"; 
    const DEFAULT_LOGO = "https://a.espncdn.com/i/leaguelogos/soccer/500/23.png";

    async function initShare() {
      const msgEl = document.getElementById("msg");
      const loaderEl = document.getElementById("loader");

      try {
        // 1. เริ่มการทำงานของ LIFF SDK
        await liff.init({ liffId: LIFF_ID });
        
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // 2. ตรวจสอบสิทธิ์ Share Target Picker
        if (!liff.isApiAvailable('shareTargetPicker')) {
          loaderEl.style.display = "none";
          msgEl.innerHTML = `<b style="color:#e74c3c;">ฟังก์ชันแชร์ยังไม่ถูกเปิดใช้งาน</b><br><small style="color:#cbd5e0;">กรุณาเปิดสวิตช์ Share Target Picker เป็น ON ใน LINE Developers Console</small>`;
          return;
        }

        // 3. ดึงและถอดรหัสพารามิเตอร์
        let searchStr = window.location.search;
        if (!searchStr && window.location.hash.includes('?')) {
          searchStr = '?' + window.location.hash.split('?')[1];
        }

        let params = new URLSearchParams(searchStr);
        if (params.has('liff.state')) {
          const stateStr = decodeURIComponent(params.get('liff.state'));
          const stateQuery = stateStr.includes('?') ? stateStr.substring(stateStr.indexOf('?')) : ('?' + stateStr);
          params = new URLSearchParams(stateQuery);
        }

        const title = params.get('t') || "MATCH UPDATE";
        const color = params.get('c') ? ('#' + params.get('c').replace('#', '')) : "#2c3e50";
        const homeName = params.get('hn') || "Home Team";
        const homeLogo = params.get('hl') || DEFAULT_LOGO;
        const awayName = params.get('an') || "Away Team";
        const awayLogo = params.get('al') || DEFAULT_LOGO;
        const scoreH = params.get('sh') || "0";
        const scoreA = params.get('sa') || "0";
        const detail = params.get('dt') || "สรุปผลการแข่งขัน";

        const centerText = scoreA !== "" ? `${scoreH} - ${scoreA}` : scoreH;

        // 4. สร้างการ์ด Flex Message
        const flexObj = {
          "type": "bubble",
          "size": "kilo",
          "header": {
            "type": "box",
            "layout": "vertical",
            "backgroundColor": color,
            "contents": [
              { "type": "text", "text": title, "color": "#ffffff", "weight": "bold", "size": "md", "align": "center" }
            ]
          },
          "body": {
            "type": "box",
            "layout": "vertical",
            "contents": [
              {
                "type": "box",
                "layout": "horizontal",
                "alignItems": "center",
                "contents": [
                  {
                    "type": "box",
                    "layout": "vertical",
                    "alignItems": "center",
                    "flex": 4,
                    "contents": [
                      { "type": "image", "url": homeLogo, "size": "40px", "aspectMode": "fit" },
                      { "type": "text", "text": homeName, "size": "xs", "weight": "bold", "wrap": true, "align": "center", "margin": "sm" }
                    ]
                  },
                  {
                    "type": "box",
                    "layout": "vertical",
                    "alignItems": "center",
                    "flex": 3,
                    "contents": [
                      { "type": "text", "text": centerText, "size": "lg", "weight": "bold", "align": "center" },
                      { "type": "text", "text": "PL", "size": "xxs", "color": "#aaaaaa" }
                    ]
                  },
                  {
                    "type": "box",
                    "layout": "vertical",
                    "alignItems": "center",
                    "flex": 4,
                    "contents": [
                      { "type": "image", "url": awayLogo, "size": "40px", "aspectMode": "fit" },
                      { "type": "text", "text": awayName, "size": "xs", "weight": "bold", "wrap": true, "align": "center", "margin": "sm" }
                    ]
                  }
                ]
              },
              { "type": "separator", "margin": "md" },
              {
                "type": "box",
                "layout": "vertical",
                "margin": "md",
                "contents": [
                  { "type": "text", "text": detail, "size": "xs", "color": "#2c3e50", "weight": "bold", "wrap": true, "align": "center" }
                ]
              }
            ]
          }
        };

        // 5. เปิดหน้าต่างแชร์
        const res = await liff.shareTargetPicker([
          {
            type: "flex",
            altText: `แชร์ผลบอล: ${homeName} vs ${awayName}`,
            contents: flexObj
          }
        ]);

        if (res) {
          liff.closeWindow();
        } else {
          liff.closeWindow();
        }
      } catch (err) {
        loaderEl.style.display = "none";
        msgEl.innerHTML = `<b style="color:#e74c3c;">เกิดข้อผิดพลาด:</b><br><small style="color:#cbd5e0;">${err.message || JSON.stringify(err)}</small>`;
      }
    }
    initShare();
  </script>
</body>
</html>
