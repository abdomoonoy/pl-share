<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แชร์ผลบอล & ตารางคะแนน พรีเมียร์ลีก</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0b0e14; color: #fff; padding: 16px; }
    .card { width: 100%; max-width: 360px; background: #1a1f2c; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .match-title { font-size: 16px; font-weight: bold; color: #00ff85; margin-bottom: 16px; }
    .teams { display: flex; align-items: center; justify-content: space-around; margin-bottom: 20px; }
    .team { flex: 1; text-align: center; }
    .team img { width: 44px; height: 44px; object-fit: contain; }
    .team span { display: block; font-size: 12px; margin-top: 6px; font-weight: bold; }
    .score { font-size: 20px; font-weight: 800; color: #fff; flex: 0.8; }
    .btn-share { width: 100%; background: #06c755; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(6,199,85,0.3); }
    .btn-share:active { transform: scale(0.98); }
    #status-msg { margin-top: 14px; font-size: 12px; color: #a0aec0; word-break: break-word; }
  </style>
</head>
<body>
  <div class="card">
    <div id="preview-box">
      <div class="match-title" id="m-title">MATCH UPDATE</div>
      <div class="teams" id="teams-box">
        <div class="team">
          <img id="m-hl" src="https://a.espncdn.com/i/leaguelogos/soccer/500/23.png">
          <span id="m-hn">Home</span>
        </div>
        <div class="score" id="m-score">- : -</div>
        <div class="team">
          <img id="m-al" src="https://a.espncdn.com/i/leaguelogos/soccer/500/23.png">
          <span id="m-an">Away</span>
        </div>
      </div>
      <button class="btn-share" id="btnShare" onclick="triggerShare()">
        <span id="btn-text">📤 กดเพื่อส่งต่อการ์ด Flex</span>
      </button>
    </div>
    <div id="status-msg">กำลังโหลดข้อมูล...</div>
  </div>

  <script>
    const LIFF_ID = "2011335665-i2smhkIR";
    const DEFAULT_LOGO = "https://a.espncdn.com/i/leaguelogos/soccer/500/23.png";
    let flexPayload = null;
    let shareAltText = "แชร์ข้อมูลพรีเมียร์ลีก";

    async function initPage() {
      const msg = document.getElementById("status-msg");
      try {
        await liff.init({ liffId: LIFF_ID });
        
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // ดึงพารามิเตอร์
        let searchStr = window.location.search;
        if (!searchStr && window.location.hash.includes('?')) {
          searchStr = '?' + window.location.hash.split('?')[1];
        }

        let params = new URLSearchParams(searchStr);
        if (params.has('liff.state')) {
          const stateStr = decodeURIComponent(params.get('liff.state'));
          const stateQuery = stateStr.includes('?') ? stateStr.substring(stateStr.indexOf('?')) : ('?' + stateStr);
          params = new URLSearchParams(stateQuery);
        }

        // กรณีแชร์ตารางคะแนน (Standings)
        if (params.get('type') === 'standings') {
          document.getElementById("m-title").innerText = "🏆 ตารางคะแนนพรีเมียร์ลีก";
          document.getElementById("teams-box").style.display = "none";
          document.getElementById("btn-text").innerText = "📤 กดเพื่อส่งต่อตารางคะแนน Flex";
          shareAltText = "อัปเดตตารางคะแนนพรีเมียร์ลีกครบ 20 อันดับ";
          
          msg.innerText = "กำลังดึงข้อมูลตารางคะแนนล่าสุด...";
          await buildStandingsFlex();
          msg.innerText = "แตะที่ปุ่มสีเขียวด้านบนเพื่อเลือกเพื่อนหรือกลุ่มที่ต้องการส่งต่อ";
          return;
        }

        // กรณีแชร์ผลบอล / พรีวิวแมตช์
        const title = params.get('t') || "MATCH UPDATE";
        const color = params.get('c') ? ('#' + params.get('c').replace('#', '')) : "#2c3e50";
        const homeName = params.get('hn') || "Home Team";
        const homeLogo = params.get('hl') || DEFAULT_LOGO;
        const awayName = params.get('an') || "Away Team";
        const awayLogo = params.get('al') || DEFAULT_LOGO;
        const scoreH = params.get('sh') || "0";
        const scoreA = params.get('sa') || "0";
        const detail = params.get('dt') || "สรุปผลการแข่งขัน";

        const centerText = scoreA !== "" ? `${scoreH} - ${scoreA}` : scoreH;
        shareAltText = `แชร์ผลบอล: ${homeName} vs ${awayName}`;

        document.getElementById("m-title").innerText = title;
        document.getElementById("m-hn").innerText = homeName;
        document.getElementById("m-hl").src = homeLogo;
        document.getElementById("m-an").innerText = awayName;
        document.getElementById("m-al").src = awayLogo;
        document.getElementById("m-score").innerText = centerText;

        flexPayload = {
          "type": "bubble",
          "size": "kilo",
          "header": {
            "type": "box",
            "layout": "vertical",
            "backgroundColor": color,
            "contents": [
              { "type": "text", "text": title, "color": "#ffffff", "weight": "bold", "size": "md", "align": "center" }
            ]
          },
          "body": {
            "type": "box",
            "layout": "vertical",
            "contents": [
              {
                "type": "box",
                "layout": "horizontal",
                "alignItems": "center",
                "contents": [
                  {
                    "type": "box",
                    "layout": "vertical",
                    "alignItems": "center",
                    "flex": 4,
                    "contents": [
                      { "type": "image", "url": homeLogo, "size": "40px", "aspectMode": "fit" },
                      { "type": "text", "text": homeName, "size": "xs", "weight": "bold", "wrap": true, "align": "center", "margin": "sm" }
                    ]
                  },
                  {
                    "type": "box",
                    "layout": "vertical",
                    "alignItems": "center",
                    "flex": 3,
                    "contents": [
                      { "type": "text", "text": centerText, "size": "lg", "weight": "bold", "align": "center" },
                      { "type": "text", "text": "PL", "size": "xxs", "color": "#aaaaaa" }
                    ]
                  },
                  {
                    "type": "box",
                    "layout": "vertical",
                    "alignItems": "center",
                    "flex": 4,
                    "contents": [
                      { "type": "image", "url": awayLogo, "size": "40px", "aspectMode": "fit" },
                      { "type": "text", "text": awayName, "size": "xs", "weight": "bold", "wrap": true, "align": "center", "margin": "sm" }
                    ]
                  }
                ]
              },
              { "type": "separator", "margin": "md" },
              {
                "type": "box",
                "layout": "vertical",
                "margin": "md",
                "contents": [
                  { "type": "text", "text": detail, "size": "xs", "color": "#2c3e50", "weight": "bold", "wrap": true, "align": "center" }
                ]
              }
            ]
          }
        };

        msg.innerText = "แตะที่ปุ่มสีเขียวด้านบนเพื่อเลือกเพื่อนหรือกลุ่มที่ต้องการส่งต่อ";
      } catch (err) {
        msg.innerHTML = `<span style="color:#e74c3c;">เกิดข้อผิดพลาด: ${err.message}</span>`;
      }
    }

    async function buildStandingsFlex() {
      const res = await fetch("https://site.web.api.espn.com/apis/v2/sports/soccer/eng.1/standings");
      const data = await res.json();
      const entries = data.children[0].standings.entries;

      const teams = entries.map((e, index) => {
        const getStat = (name) => {
          const s = (e.stats || []).find(st => st.name === name || st.type === name);
          return s ? (s.displayValue || s.value) : "0";
        };
        return {
          rank: (index + 1).toString(),
          name: e.team.shortDisplayName || e.team.displayName || e.team.name,
          logo: (e.team.logos && e.team.logos[0]) ? e.team.logos[0].href : DEFAULT_LOGO,
          played: getStat("gamesPlayed"),
          diff: getStat("pointDifferential") || getStat("goalDifference"),
          points: getStat("points")
        };
      });

      const top10 = teams.slice(0, 10);
      const bottom10 = teams.slice(10, 20);

      const card1 = createStandingsBubble("🏆 PL STANDINGS (1 - 10)", top10);
      const card2 = createStandingsBubble("🏆 PL STANDINGS (11 - 20)", bottom10);

      flexPayload = {
        type: "carousel",
        contents: [card1, card2]
      };
    }

    function createStandingsBubble(headerTitle, teamList) {
      const rows = teamList.map(t => {
        const rankNum = parseInt(t.rank, 10);
        let rankColor = "#555555";
        if (rankNum <= 4) rankColor = "#2980b9";
        if (rankNum >= 18) rankColor = "#c0392b";

        const diffVal = parseInt(t.diff, 10);
        const diffStr = diffVal > 0 ? `+${diffVal}` : t.diff.toString();

        return {
          "type": "box",
          "layout": "horizontal",
          "alignItems": "center",
          "margin": "sm",
          "contents": [
            { "type": "text", "text": t.rank, "size": "xxs", "weight": "bold", "color": rankColor, "flex": 1, "align": "center" },
            { "type": "image", "url": t.logo, "size": "14px", "aspectMode": "fit", "flex": 1 },
            { "type": "text", "text": t.name, "size": "xxs", "weight": "bold", "color": "#2c3e50", "flex": 4, "wrap": false },
            { "type": "text", "text": t.played.toString(), "size": "xxs", "color": "#7f8c8d", "flex": 1, "align": "center" },
            { "type": "text", "text": diffStr, "size": "xxs", "color": "#7f8c8d", "flex": 1, "align": "center" },
            { "type": "text", "text": t.points.toString(), "size": "xxs", "weight": "bold", "color": "#27ae60", "flex": 1, "align": "center" }
          ]
        };
      });

      return {
        "type": "bubble",
        "size": "kilo",
        "header": {
          "type": "box",
          "layout": "vertical",
          "backgroundColor": "#3d195b",
          "contents": [
            { "type": "text", "text": headerTitle, "color": "#00ff85", "weight": "bold", "size": "xs", "align": "center" }
          ]
        },
        "body": {
          "type": "box",
          "layout": "vertical",
          "contents": [
            {
              "type": "box",
              "layout": "horizontal",
              "contents": [
                { "type": "text", "text": "#", "size": "xxs", "color": "#95a5a6", "weight": "bold", "flex": 1, "align": "center" },
                { "type": "text", "text": " ", "flex": 1 },
                { "type": "text", "text": "สโมสร", "size": "xxs", "color": "#95a5a6", "weight": "bold", "flex": 4 },
                { "type": "text", "text": "แข่ง", "size": "xxs", "color": "#95a5a6", "weight": "bold", "flex": 1, "align": "center" },
                { "type": "text", "text": "+/-", "size": "xxs", "color": "#95a5a6", "weight": "bold", "flex": 1, "align": "center" },
                { "type": "text", "text": "แต้ม", "size": "xxs", "color": "#95a5a6", "weight": "bold", "flex": 1, "align": "center" }
              ]
            },
            { "type": "separator", "margin": "xs" },
            ...rows
          ]
        }
      };
    }

    async function triggerShare() {
      const msg = document.getElementById("status-msg");
      if (!flexPayload) {
        alert("กำลังจัดเตรียมข้อมูล กรุณารอสักครู่");
        return;
      }

      try {
        if (liff.isApiAvailable('shareTargetPicker')) {
          const res = await liff.shareTargetPicker([
            {
              type: "flex",
              altText: shareAltText,
              contents: flexPayload
            }
          ]);
          if (res) {
            liff.closeWindow();
          }
        } else {
          alert("อุปกรณ์นี้ไม่รองรับการแชร์ข้อความ");
        }
      } catch (err) {
        msg.innerHTML = `<span style="color:#e74c3c;">แชร์ไม่สำเร็จ: ${err.message || JSON.stringify(err)}</span>`;
      }
    }

    initPage();
  </script>
</body>
</html>
